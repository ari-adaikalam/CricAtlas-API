      - eval_time: 9m
        alertname: GrafanaRssHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: GrafanaRssHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: grafana}
            exp_annotations:
              summary: Grafana's resident memory (RSS) has been above 580 MiB for 2 minutes
              description: This is above the highest RSS seen in normal dashboard use (556 MiB). It flags unusual growth in the process, not an approach to a kill, and it can miss a spike that lasts seconds.

  - name: grafana rss in normal use and in a short spike stays quiet
