  - name: the firewall is not loaded, differs from the release, or is not persisted
    interval: 1m
    input_series:
      - series: 'cricket_firewall_loaded'
        values: '1x5 0x30'
      - series: 'cricket_firewall_matches_release'
        values: '1x5 0x40'
      - series: 'cricket_firewall_persisted_matches_release'
        values: '1x5 0x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: FirewallDriftsFromRelease
        exp_alerts: []
      - eval_time: 12m
        alertname: FirewallNotLoaded
        exp_alerts: []
      - eval_time: 20m
        alertname: FirewallNotLoaded
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: The host firewall table is not loaded
              description: Port 443 would be open to everyone. Run host/apply_firewall.sh for the current release.
      - eval_time: 30m
        alertname: FirewallDriftsFromRelease
        exp_alerts:
          - exp_labels: {severity: high}
            exp_annotations:
              summary: The loaded firewall does not hold the current release's Cloudflare ranges
              description: It was changed by hand or the release's rules were never applied. Run host/apply_firewall.sh for the current release.
      - eval_time: 30m
        alertname: FirewallNotPersisted
        exp_alerts:
          - exp_labels: {severity: high}
            exp_annotations:
              summary: The firewall a reboot would load is not the current release's
              description: /etc/nftables.d/cricket.nft differs from the release or does not exist. Run host/apply_firewall.sh for the current release.

  - name: the firewall check stopped running
    interval: 1m
    input_series:
      - series: 'up{job="node"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: FirewallCheckStale
        exp_alerts: []
      - eval_time: 45m
        alertname: FirewallCheckStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: The firewall check has not run for 30 minutes
              description: The three firewall alerts above cannot fire while it is not running.

  - name: the firewall state cannot be worked out, or the check's output is missing
    interval: 1m
    input_series:
      - series: 'cricket_firewall_loaded'
        values: '1x60'
      - series: 'cricket_firewall_matches_release'
        values: '1x5 -1x40'
      - series: 'cricket_firewall_persisted_matches_release'
        values: '1x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: FirewallStateUnknown
        exp_alerts: []
      - eval_time: 30m
        alertname: FirewallStateUnknown
        exp_alerts:
          - exp_labels: {severity: high}
            exp_annotations:
              summary: The firewall check cannot tell whether the firewall is the current release's
              description: A list or the firewall could not be read, or the check's output is missing. The firewall may be wrong and nothing says so. Run host/firewall_check.sh by hand.
      - eval_time: 30m
        alertname: FirewallDriftsFromRelease
        exp_alerts: []

