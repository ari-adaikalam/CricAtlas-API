# Generated by `python -m cricket_notifier rules`. Do not edit: the table is in cricket_notifier/rules.py.
groups:
  - name: cricket_notifier_summary
    interval: 15s
    rules:
      - record: cricket:process_start_time:max
        expr: max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:requests:sum
        expr: sum(cricket_api_requests_total) or 0 * max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:requests:by_status
        expr: sum by (status) (cricket_api_requests_total)
      - record: cricket:admission:by_class_outcome
        expr: sum by (class, outcome) (cricket_api_admission_total)
      - record: cricket:request_duration:by_le
        expr: sum by (le) (cricket_api_request_duration_seconds_bucket)
      - record: cricket:faults:sum
        expr: sum(cricket_api_faults_total) or 0 * max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:faults_unwritten:sum
        expr: sum(cricket_api_fault_log_suppressed_total) or 0 * max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:query_timeouts:sum
        expr: sum(cricket_api_query_timeouts_total) or 0 * max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:query_busy:sum
        expr: sum(cricket_api_query_busy_total) or 0 * max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:cpu_seconds:sum
        expr: sum(cricket_api_cgroup_cpu_seconds_total) or 0 * max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:oom_kills:sum
        expr: sum(cricket_api_cgroup_oom_kills_total) or 0 * max(process_start_time_seconds{job="cricket-api"})
      - record: cricket:memory_bytes:max
        expr: max(cricket_api_cgroup_memory_bytes)
      - record: cricket:memory_limit_bytes:max
        expr: max(cricket_api_cgroup_memory_limit_bytes)
      - record: cricket:uptime_seconds:max
        expr: max(cricket_api_uptime_seconds)
      - record: cricket:data_built:max
        expr: max(cricket_api_data_built_timestamp_seconds)
      - record: cricket:data_version:info
        expr: max by (data_version) (cricket_api_data_info)
      - record: cricket:refresh_enabled:max
        expr: max(cricket_data_refresh_enabled)
      - record: cricket:refresh_failed:max
        expr: max(cricket_data_refresh_failed)
      - record: cricket:refresh_pending:max
        expr: max(cricket_data_refresh_pending)
      - record: cricket:refresh_check:max
        expr: max(cricket_data_refresh_last_check_seconds)
      - record: cricket:refresh_activation:max
        expr: max(cricket_data_refresh_last_activation_seconds)
      - record: cricket:refresh_observed:max
        expr: max(cricket_data_refresh_observed_seconds)
