[project]
name = "cricket-notifier"
version = "0.1.0"
description = "Private monitoring emails for the Cricket API: alerts, recovery notices and a daily summary, sent through Resend"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cricket-notifier = "cricket_notifier.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cricket_notifier*"]

[tool.setuptools.package-data]
"cricket_notifier" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
